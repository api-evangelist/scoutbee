description: 'Scoutbee is an AI-powered supplier discovery and procurement intelligence
  platform that helps enterprise buyers instantly find, vet, and connect with trusted
  suppliers. Founded in 2015 in Berlin, Germany, Scoutbee uses large language models,
  knowledge-graph technology, and a global supplier network to power supplier discovery,
  sourcing project execution (Streamline), and a centralized supplier data foundation
  (DeepSee), surfaced through the Scoutbee Intelligence Platform. Its AI gives procurement,
  sourcing, and category-management teams recommendations for suppliers matched on
  qualifications, risk, certifications, sustainability, diversity, cost, and experience.
  Scoutbee integrates with SAP Ariba guided sourcing and, following its October 2025
  acquisition by Coupa, is being embedded into the Coupa Supplier Portal. Scoutbee
  does not currently publish a public developer API or documentation portal; this
  profile captures its public identity and web surface.'
